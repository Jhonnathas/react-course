<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js">  </script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      function ChatbotInput() {
        return (
        <>
            <input 
              placeholder="Send a message" 
              size="40"
            />
            <button>Send</button>
        </>);
      }

      function ChatbotMessage( {message, sender} ) {
        //const message = props.message;
        //const sender = props.sender;
        //const {message, sender} = props;
        /*
        if(sender === 'robot'){
          return (
            <div>
              {message}
              <img src="robot.png" width="50"/>
            </div>
          );
        }
        */
          return (
          <div>
            {sender === 'robot' && <img src="robot.png" width="50"/>}
            {message}
            {sender === 'user' && <img src="user.png" width="50"/>}
          </div>
          );
      }

      function SendMessage() {
        chatMessages.push({message: "New message", sender: "user", id: crypto.randomUUID()});
        console.log(chatMessages);
      }

      function ChatMessages() {
        const chatMessages = [
          {message: "hello chatbot", sender: "user", id: "id1"},
          {message: "how are you?", sender: "robot", id: "id2"},
          {message: "I'm doing great!", sender: "user", id: "id3"},
          {message: "Nice!", sender: "robot", id: "id4"}
        ];
        
        return (
          <>
            <button onClick={SendMessage}>Send Message</button>
            {chatMessages.map((chatMessage) =>{
              return (
                <ChatbotMessage 
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
          );
      }

      function App() {
        return (
          <>
            <ChatbotInput />
            <ChatMessages />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
