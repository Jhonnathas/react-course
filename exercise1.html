<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 1</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js">  </script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      const productCost = 10 + 2*8;
      const shippingCost = 5;
      const totalCost = productCost + shippingCost;
      console.log(productCost);
      console.log(dayjs().format('MMM D'));
      const dataHJ = (dayjs().format('MMM D'));
      const time= dayjs().format('HH:mm:ss');
      const divisao = <div>
        <button>Good job!</button>
        <p>My name is Simon</p>
        <p>Cotton socks</p>
        <p>Price: $10</p>
        <button>Add to Cart</button>
        <p>Product cost: $ {productCost}</p>
        <p>Shipping cost: $ {shippingCost}</p>
        <p>Total cost: $ {totalCost}</p>
        <button>Place your order</button>
        <p>Today is {dataHJ}</p>
        <p>Current time: {time}</p>
      </div>;
      const root = ReactDOM.createRoot(document.querySelector('.js-container'));
      setInterval(() => {
        root.render(divisao);
      }, 1000);
    </script>
  </body>
